<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Casanet</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="logo-casanet.png" alt="Logo" class="site-logo">
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-item">Accueil</a></li>
            <li><a href="index.html#blog" class="nav-item">Blog</a></li>
            <li><a href="contact.html" class="nav-item active">Contact</a></li>
        </ul>
    </nav>

    <main class="contact-page">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-info">
                    <h1 class="headline">Contactez <span class="gradient-text">Casanet</span></h1>
                    <div class="info-card">
                        <div class="info-item"><i data-lucide="map-pin"></i><p>Av. Annakhil, Immeuble Riad 1, Rabat</p></div>
                        <div class="info-item"><i data-lucide="phone"></i><p>05 37 54 83 00</p></div>
                        <div class="info-item"><i data-lucide="mail"></i><p>contact@casanet.ma</p></div>
                    </div>
                </div>

                <div class="contact-form-container">
                    <form class="contact-form">
                        <div class="form-group"><label>Nom</label><input type="text"></div>
                        <div class="form-group"><label>Email</label><input type="email"></div>
                        <div class="form-group"><label>Message</label><textarea rows="4"></textarea></div>
                        <button type="submit" class="btn-primary">Envoyer</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
